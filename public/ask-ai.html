<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>ถามข้อมูลบริษัท (MCP demo)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root { --bg:#0f172a; --card:#1e293b; --me:#3b82f6; --bot:#334155; --text:#f1f5f9; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans Thai',sans-serif;
         background:var(--bg); color:var(--text); display:flex; flex-direction:column; height:100vh; }
  header { padding:14px 20px; background:var(--card); border-bottom:1px solid #334155; }
  header h1 { margin:0; font-size:18px; }
  header small { color:#94a3b8; }
  #chat { flex:1; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:75%; padding:10px 14px; border-radius:14px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; }
  .me  { align-self:flex-end; background:var(--me); }
  .bot { align-self:flex-start; background:var(--bot); }
  .bot.loading::after { content:'…'; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity:.3; } }
  form { display:flex; gap:8px; padding:14px; background:var(--card); border-top:1px solid #334155; }
  input { flex:1; padding:12px 14px; border-radius:10px; border:1px solid #475569; background:#0f172a; color:var(--text); font-size:15px; }
  button { padding:0 20px; border-radius:10px; border:0; background:var(--me); color:#fff; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
</style>
</head>
<body>
<header>
  <h1>💬 ถามข้อมูลบริษัท / ลูกค้า</h1>
  <small>MCP demo · เชื่อมกับ menam_workflow MySQL ผ่าน Claude</small>
</header>

<div id="chat">
  <div class="msg bot">สวัสดีครับ ลองถามได้เลย เช่น:
• "ยอด GL วันนี้เป็นยังไง"
• "GL วันนี้แยกตามบัญชีหน่อย"
• "AR คงค้าง top 10 site wire"
• "มีลูกค้าชื่อ ไทยเบฟ ไหม"
• "credit days ของ CUST001 กี่วัน"</div>
</div>

<form id="f">
  <input id="q" placeholder="พิมพ์คำถาม..." autocomplete="off" required>
  <button id="send">ส่ง</button>
</form>

<script>
const API = "ask-ai.php";
const chat = document.getElementById('chat');
const form = document.getElementById('f');
const input = document.getElementById('q');
const btn = document.getElementById('send');
let history = [];

function addMsg(text, cls) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  el.textContent = text;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const q = input.value.trim();
  if (!q) return;
  addMsg(q, 'me');
  input.value = '';
  btn.disabled = true;
  const loading = addMsg('', 'bot loading');
  try {
    const r = await fetch(API, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ message: q, history })
    });
    const j = await r.json();
    loading.classList.remove('loading');
    if (j.error) {
      loading.textContent = '⚠️ ' + j.error;
    } else {
      loading.textContent = j.reply || '(ไม่มีคำตอบ)';
      history.push({ role:'user', content:q });
      history.push({ role:'assistant', content:j.reply });
    }
  } catch (err) {
    loading.classList.remove('loading');
    loading.textContent = '⚠️ ผิดพลาด: ' + err.message;
  } finally {
    btn.disabled = false;
    input.focus();
  }
});
</script>
</body>
</html>
